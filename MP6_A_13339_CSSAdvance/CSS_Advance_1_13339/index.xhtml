<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>Formulir Registrasi Mahasiswa</title>
    <link rel="stylesheet" type="text/css" href="style.css" />
</head>
<body>
    <div class="container">
        <h1>Formulir Registrasi Mahasiswa</h1>
        <p class="intro">Silakan lengkapi data diri berikut untuk registrasi mahasiswa.</p>

        <form action="" method="post" enctype="multipart/form-data">
            <table cellspacing="4" cellpadding="4" border="1">
                <tr>
                    <td>
                        <label for="namamhs"><strong>Nama Lengkap</strong></label>
                    </td>
                    <td>
                        <input type="text" id="namamhs" name="namamhs" size="30" />
                    </td>
                </tr>

                <tr>
                    <td><strong>Jenis Kelamin</strong></td>
                    <td>
                        <input type="radio" id="laki" name="jk" value="Laki-laki" />
                        <label for="laki">Laki-laki</label>

                        <input type="radio" id="perempuan" name="jk" value="Perempuan" />
                        <label for="perempuan">Perempuan</label>
                    </td>
                </tr>

                <tr>
                    <td>
                        <label for="prodi"><strong>Program Studi</strong></label>
                    </td>
                    <td>
                        <select id="prodi" name="prodi">
                            <option value="Informatika">Informatika</option>
                            <option value="Sistem Informasi">Sistem Informasi</option>
                            <option value="Teknik Industri">Teknik Industri</option>
                        </select>
                    </td>
                </tr>

                <tr>
                    <td>
                        <label for="email"><strong>Alamat Email</strong></label>
                    </td>
                    <td>
                        <input type="text" id="email" name="email" size="30" />
                    </td>
                </tr>

                <tr>
                    <td>
                        <label for="telepon"><strong>Nomor Telepon</strong></label>
                    </td>
                    <td>
                        <input type="text" id="telepon" name="telepon" size="30" />
                    </td>
                </tr>

                <tr>
                    <td>
                        <label for="password"><strong>Password</strong></label>
                    </td>
                    <td>
                        <input type="password" id="password" name="password" size="30" />
                    </td>
                </tr>

                <tr>
                    <td>
                        <label for="photo"><strong>Foto Mahasiswa</strong></label>
                    </td>
                    <td>
                        <input type="file" id="photo" name="photo"
                            accept="image/gif, image/jpeg, image/png" />
                    </td>
                </tr>

                <tr>
                    <td>
                        <label for="namasmu"><strong>Asal Sekolah</strong></label>
                    </td>
                    <td>
                        <input type="text" id="namasmu" name="namasmu" size="30" />
                    </td>
                </tr>

                <tr>
                    <td class="top"><strong>Hal Favorit</strong></td>
                    <td>
                        <p>
                            <strong>Band yang Disukai</strong><br />
                            <input type="checkbox" id="Band1" name="Band" value="Metallcia" />
                            <label for="Band1">Metallcia</label>

                            <input type="checkbox" id="Band2" name="Band" value="Red Hot Chili Peppers" />
                            <label for="Band2">Red Hot Chili Peppers</label>

                            <input type="checkbox" id="Band3" name="Band" value="Linkin Park" />
                            <label for="Band3">Linkin Park</label>
                        </p>

                        <p>
                            <strong>Club Bola yang Disukai</strong><br />
                            <input type="checkbox" id="bola1" name="Bola" value="Manchester United" />
                            <label for="bola1">Manchester United</label>

                            <input type="checkbox" id="bola2" name="bola" value="Aston Villa" />
                            <label for="bola2">Aston Villa</label>

                            <input type="checkbox" id="bola3" name="bola" value="Blodo Glimt" />
                            <label for="bola3">Blodo Glimt</label>
                        </p>
                    </td>
                </tr>

                <tr>
                    <td class="top">
                        <label for="resume"><strong>Tentang Saya</strong></label>
                    </td>
                    <td>
                        <textarea id="resume" name="resume" rows="8" cols="30"></textarea>
                    </td>
                </tr>

                <tr>
                    <td colspan="2" class="submit-cell">
                        <input type="submit" name="simpan" value="Kirim Data" />
                    </td>
                </tr>
            </table>
        </form>

        <p class="note">Pastikan data yang kamu isi sudah benar sebelum dikirim.</p>
    </div>
</body>
</html>
