<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">

<head>
    <title>Form Pendaftaran Ekskul (XHTML)</title>
    <meta http-equiv="content-type" content="text/html; charset=utf-8" />
    <script type="text/javascript">
            function fn_Valform() {
            var sMsg = "";

            if (document.getElementById("nama").value == "") {
                sMsg += "\n* Anda belum mengisikan nama";
            }
            if (document.getElementById("kelas").value == "") {
                sMsg += "\n* Anda belum mengisikan kelas";
            }
            if (document.getElementById("alasan").value == "") {
                sMsg += "\n* Anda belum mengisikan alasan";
            }

            if (sMsg != "") {
                alert("Peringaratan:\n" + sMsg);
                return false;
            } else {
                return true;
            }
        }
    </script>
</head>

<body>
    <h1>From Pendaftaran Ekskul</h1>
    <form action="#" menthod="post" onsubmit="return fn_Valform();">
        <p>Nama:<br /><input type="text" id="nama" name="nama" /></p>
        <p>Kelas:<br /><input type="text" id="kelas" name="kelas" /></p>
        <p>Alasan Bergabung:
            <br /><textarea id="alasan" name="alasan" rows="4" cols="30"></textarea></p>
        <p><input type="submit" value="Send" /></p>
    </form>
</body>

</html>
